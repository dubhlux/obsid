name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: examples are committed prebuilt (host/browser/examples/*.wasm,
      # built with almide 0.27.x and verified in-browser). The previous
      # "cargo install --branch develop" rebuild produced binaries that trap
      # with "render_frame: unreachable" — do not reintroduce CI rebuilds
      # until the develop wasm codegen regression is fixed.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: host/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
